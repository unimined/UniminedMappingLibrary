name: Tests

on:
  pull_request:
  push:
    branches-ignore:
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run build and tests
        run: ./gradlew kotlinUpgradeYarnLock build
